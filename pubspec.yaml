name: exfin_rest
description: EXFIN Restaurant Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # GraphQL (PostgreSQL için gerekli değil)
  # graphql_flutter: ^5.1.2
  # graphql_codegen: ^1.1.0

  # HTTP Client (PostgreSQL için gerekli değil)
  # http: ^1.1.0
  # dio: ^5.4.0
  # retrofit: ^4.0.3

  # PostgreSQL Database
  postgres: ^2.6.3

  # SignalR for real-time communication
  signalr_netcore: ^1.4.3

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.2
  path: ^1.8.3

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  
  # PlutoGrid DataGrid

  # Navigation
  go_router: ^16.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # Notifications
  flutter_local_notifications: ^19.3.0

  # WebSocket for real-time
  web_socket_channel: ^3.0.3
  fl_chart: ^1.0.0
  pluto_grid: ^8.0.0
  syncfusion_flutter_xlsio: ^30.1.39
  csv: ^6.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  # retrofit_generator: ^9.2.0
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.7

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env 